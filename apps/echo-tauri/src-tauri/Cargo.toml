[package]
name = "echo-tauri"
version = "0.1.0"
edition = "2024"
description = "Tauri desktop client for echo-agent"
publish = false

[lib]
name = "echo_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
echo-app-core = { path = "../../echo-app-core" }

tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"

tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-stream = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
anyhow = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
once_cell = "1"

[features]
# 兼容 Tauri 默认 feature 设定（custom-protocol 由 build 自动启用）
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"
