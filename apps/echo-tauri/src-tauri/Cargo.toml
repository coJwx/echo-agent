[package]
name = "echo-tauri"
version = "0.1.0"
edition = "2024"
description = "Tauri desktop client for echo-agent"
publish = false

[lib]
name = "echo_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# 直接路径依赖根目录的 echo_agent（避开 crates.io 未发版本不一致问题）
# 启用 mcp 特性：MCP 配置页要用 McpManager
echo_agent = { path = "../../..", default-features = false, features = ["mcp"] }
# 工具集：MVP 暴露 files (read_file/list_dir/write_file/...) + shell
echo_tools = { path = "../../../echo-tools", default-features = false, features = ["files", "shell"] }
echo_core  = { path = "../../../echo-core" }
echo_state = { path = "../../../echo-state", features = ["sqlite"] }
echo_integration = { path = "../../../echo-integration" }

tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"

tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-stream = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
anyhow = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
once_cell = "1"

[features]
# 兼容 Tauri 默认 feature 设定（custom-protocol 由 build 自动启用）
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"
