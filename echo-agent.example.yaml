# echo-agent 完整示例配置
#
# 使用方式：
#   1. 设置 ROOT_AGENT_DIR 指向配置目录；不设置时默认使用 ~/.echo-agent
#   2. 将此文件复制为 $ROOT_AGENT_DIR/config.yaml
#
# 语法说明：
#   - ${VAR_NAME} 会被解析为对应的环境变量值
#   - 模型 provider 注册写入 $ROOT_AGENT_DIR/models.yaml
#   - 本文件只包含 `model` / `agent` / `channels` / `mcp` / `server` / `logging`

# ── Runtime 配置（供 echo_agent::config 使用）───────────────────────────────
model:
  name: qwen3.7-plus
  max_tokens: 4096
  temperature: 0.7

agent:
  name: echo-assistant
  system_prompt: "你是一个智能助手，可以帮助用户回答问题、执行任务。"
  max_iterations: 10
  enable_tools: true
  enable_memory: true
  enable_human_in_loop: true
  memory_path: ~/.echo-agent/memory

channels:
  # QQ Bot 通道
  qq:
    enabled: false
    app_id: ${QQ_APP_ID}
    client_secret: ${QQ_CLIENT_SECRET}

  # 飞书通道
  feishu:
    enabled: false
    app_id: ${FEISHU_APP_ID}
    app_secret: ${FEISHU_APP_SECRET}
    mode: long_poll   # long_poll | webhook

  # IM 会话配置
  session:
    timeout_minutes: 60
    reset_keywords:
      - 重置对话
      - 新对话
      - 清除记忆
    reset_commands:
      - /reset
      - /clear
      - /new

mcp:
  config_path: ./mcp.json

server:
  host: 0.0.0.0
  port: 3000

logging:
  level: info
